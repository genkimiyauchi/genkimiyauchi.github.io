    Public Engagement:
      - label: 2022 — SwarmHack
        details:
          Organised and staffed a three-day university robotics hackathon across the Universities of York, Sheffield, and Manchester, UK, enabling students to design and
          operate a swarm of robots through hands-on learning and collaboration.
      - label: 2017–2019 — KCL Robotics Society Robotic Courses
        details:
          Organised weekly robotics courses during term-time for university students and summer courses for school pupils interested in building a remotely controlled robot,
          as a member of KCL Robotics Society at King's College London, UK.
      - label: 2017–2019 — Robot Artist (King's Undergraduate Research Fellowship)
        details:
          Developed Robot Artist at King's College London, UK, integrating a TurtleBot2 with a four-axis robotic manipulator using ROS to draw human portraits on a canvas.
          Processed images with OpenCV to generate trajectories for a slanted easel. Conducted live robot demonstrations at university open days for three years, generating portraits
          for visitors.
        url: https://youtu.be/3rnpzn-2JuY

