ja:
  biography: |
    スウォームロボティクス、マルチロボットシステム、ヒューマンロボットインタラクションを対象に、ロボットの集団が協調し、環境に適応し、人と共に働く仕組みを研究しています。

    現在は[ブリストル大学](https://www.bristol.ac.uk/)と[Bristol Robotics Laboratory](https://www.bristolroboticslab.com/)にて、[Sabine Hauert](https://hauertlab.com/) 教授のもと、スウォームの技術を自動配達ロボットに応用する研究を行っています。以前はシェフィールド大学の研究員として、Horizon Europe / Innovate UK の [OpenSwarm](https://openswarm.eu/) プロジェクトに携わり、エネルギー消費を考慮したロボットスウォームの研究を行っていました。2024年に[シェフィールド大学](https://www.sheffield.ac.uk/)にて、[Roderich Groß](https://www.informatik.tu-darmstadt.de/rcps/rcps_menu/index.en.jsp) 教授の指導のもと、複数の人間がロボットスウォームの制御を動的に共有する手法について研究し、博士号を取得しました。

    <a class="btn btn-sm btn-outline-primary calendar-toggle-btn cv-button" href="https://drive.google.com/file/d/1tVsMUuyUwZAz0J_j7z06nNfaRYFWE0Ah/view?usp=sharing">CV</a>

